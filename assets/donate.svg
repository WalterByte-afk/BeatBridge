<svg height="512" viewbox="0 0 512 512" width="512" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="50%" cy="50%" id="bgGradTip" r="65%">
<stop offset="0%" stop-color="#18231c"></stop>
<stop offset="60%" stop-color="#0d1410"></stop>
<stop offset="100%" stop-color="#050806"></stop>
</radialgradient>
<filter height="160%" id="goldCoinGlow" width="160%" x="-30%" y="-30%">
<fedropshadow dx="0" dy="0" flood-color="#f59e0b" flood-opacity="0.9" stddeviation="6"></fedropshadow>
</filter>
<filter height="160%" id="emeraldJarGlow" width="160%" x="-30%" y="-30%">
<fedropshadow dx="0" dy="0" flood-color="#10b981" flood-opacity="0.85" stddeviation="5"></fedropshadow>
</filter>
<filter height="160%" id="cyanSparkGlow" width="160%" x="-30%" y="-30%">
<fedropshadow dx="0" dy="0" flood-color="#38bdf8" flood-opacity="0.9" stddeviation="5"></fedropshadow>
</filter>
<filter height="140%" id="whiteGlint" width="140%" x="-20%" y="-20%">
<fedropshadow dx="0" dy="0" flood-color="#ffffff" flood-opacity="0.9" stddeviation="4"></fedropshadow>
</filter>
</defs>
<style>
    /* Jar Joyful Bounce & Jiggle when coins drop */
    @keyframes jarJiggle {
      0%, 100% { transform: translateY(0px) scale(1); }
      18% { transform: translateY(-8px) scale(0.97, 1.04); }
      35% { transform: translateY(5px) scale(1.04, 0.96); }
      50% { transform: translateY(-4px) scale(0.99, 1.02); }
      70% { transform: translateY(2px) scale(1.02, 0.98); }
    }

    /* Falling Golden Pixel Coin 1 */
    @keyframes coinDrop1 {
      0% { transform: translate(256px, 10px) scale(0.6) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      45% { transform: translate(248px, 120px) scale(1.05) rotate(90deg); opacity: 1; }
      55% { transform: translate(252px, 160px) scale(0.85) rotate(135deg); opacity: 0.9; }
      75% { transform: translate(250px, 260px) scale(0.9) rotate(180deg); opacity: 0.3; }
      80%, 100% { transform: translate(250px, 300px) scale(0.7); opacity: 0; }
    }

    /* Falling Coin 2 with slight offset rhythm */
    @keyframes coinDrop2 {
      0% { transform: translate(220px, 0px) scale(0.5); opacity: 0; }
      20% { opacity: 0; }
      30% { transform: translate(230px, 30px) scale(0.7); opacity: 1; }
      60% { transform: translate(242px, 140px) scale(1) rotate(-45deg); opacity: 1; }
      75% { transform: translate(240px, 200px) scale(0.8); opacity: 0.5; }
      85%, 100% { transform: translate(240px, 280px) scale(0.6); opacity: 0; }
    }

    /* Floating Rising Sparkles / Thank-You Shimmer */
    @keyframes sparkleFloat1 {
      0% { transform: translate(110px, 340px) scale(0.2); opacity: 0; }
      30% { opacity: 1; }
      80% { opacity: 0.85; }
      100% { transform: translate(70px, 140px) scale(1.2); opacity: 0; }
    }
    @keyframes sparkleFloat2 {
      0% { transform: translate(400px, 350px) scale(0.2); opacity: 0; }
      35% { opacity: 1; }
      85% { opacity: 0.85; }
      100% { transform: translate(430px, 150px) scale(1.3); opacity: 0; }
    }
    @keyframes heartFloatTip {
      0% { transform: translate(256px, 130px) scale(0.3); opacity: 0; }
      30% { opacity: 1; transform: translate(256px, 90px) scale(1.1); }
      70% { opacity: 0.9; transform: translate(265px, 45px) scale(1); }
      100% { transform: translate(250px, 10px) scale(0.7); opacity: 0; }
    }

    /* Golden Ring Shockwave from coin impact */
    @keyframes tipRingImpact {
      0%, 40% { r: 10px; opacity: 0; stroke-width: 0px; }
      45% { r: 20px; opacity: 1; stroke-width: 4px; }
      80% { r: 110px; opacity: 0; stroke-width: 1px; }
      100% { opacity: 0; }
    }

    /* AuraDJ Pixel Face Inside the Glass Jar */
    @keyframes happyCheekPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes mascotEyeWinkJoy {
      0%, 100% { transform: scale(1); }
      45%, 60% { transform: scaleY(0.2) translateY(8px); }
    }

    .jar-body { transform-origin: 256px 360px; animation: jarJiggle 1.6s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
    .coin-drop-1 { animation: coinDrop1 1.6s cubic-bezier(0.3, 0.8, 0.4, 1) infinite; }
    .coin-drop-2 { animation: coinDrop2 1.6s cubic-bezier(0.3, 0.8, 0.4, 1) 0.8s infinite; }
    .spark-1 { animation: sparkleFloat1 2.2s ease-out infinite; }
    .spark-2 { animation: sparkleFloat2 2.4s ease-out 0.7s infinite; }
    .heart-tip { animation: heartFloatTip 2.4s ease-out 0.4s infinite; }
    .impact-shock { transform-origin: 256px 145px; animation: tipRingImpact 1.6s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
    .cheek-blush { animation: happyCheekPulse 1.6s ease-in-out infinite; }
    .joy-eye-left { transform-origin: 216px 292px; animation: mascotEyeWinkJoy 1.6s ease-in-out infinite; }
  </style>
<!-- Dark Emerald / Neon Vault Room Background -->


<!-- Coin Impact Soundwave / Ripple at Jar Rim -->
<circle class="impact-shock" cx="256" cy="145" fill="none" filter="url(#goldCoinGlow)" r="20" stroke="#fbbf24"></circle>
<!-- Floating Pixel Sparkles & Diamonds -->
<g class="spark-1" filter="url(#goldCoinGlow)">
<polygon fill="#fde047" points="0,-8 3,-2 9,0 3,2 0,8 -3,2 -9,0 -3,-2"></polygon>
<rect fill="#34d399" height="6" rx="1" width="6" x="8" y="10"></rect>
</g>
<g class="spark-2" filter="url(#cyanSparkGlow)">
<polygon fill="#38bdf8" points="0,-10 4,-3 11,0 4,3 0,10 -4,3 -11,0 -4,-3"></polygon>
<rect fill="#fde047" height="6" rx="1" width="6" x="-10" y="8"></rect>
</g>
<!-- Floating Heart from Generous Tip -->
<g class="heart-tip" filter="url(#goldCoinGlow)">
<path d="M 0,4 L 4,0 L 8,0 L 12,4 L 16,0 L 20,0 L 24,4 L 24,8 L 12,20 L 0,8 Z" fill="#f43f5e"></path>
</g>
<!-- FALLING COIN 1 (Pixel Golden Coin with Currency Symbol) -->
<g class="coin-drop-1" filter="url(#goldCoinGlow)">
<!-- 28x28 Pixel Gold Coin -->
<rect fill="#f59e0b" height="28" rx="6" stroke="#fde047" stroke-width="2" width="28" x="-14" y="-14"></rect>
<rect fill="#fbbf24" height="20" rx="3" width="20" x="-10" y="-10"></rect>
<!-- Pixel Music Note / DJ Currency Symbol inside Coin -->
<rect fill="#78350f" height="12" width="3" x="-4" y="-7"></rect>
<rect fill="#78350f" height="4" width="6" x="-1" y="-7"></rect>
<circle cx="-5" cy="5" fill="#78350f" r="3.5"></circle>
<!-- White Glint -->
<rect fill="#ffffff" filter="url(#whiteGlint)" height="3" width="3" x="3" y="-8"></rect>
</g>
<!-- FALLING COIN 2 -->
<g class="coin-drop-2" filter="url(#goldCoinGlow)">
